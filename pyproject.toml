[project]
name = "astar"
version = "0.1.0"
description = "A* algorithm with demo"
readme = "README.md"
authors = [
    { name = "Josh Chen", email = "bochfchen.code@gmail.com" }
]
requires-python = ">=3.16"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
]

[project.scripts]
astar = "astar:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
